<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="title desc"><title id="title">Monthly rainfall from January through April</title><desc id="desc">A bar chart showing rainfall totals of 42, 58, 51, and 49 millimeters for January, February, March, and April.</desc><rect width="720" height="420" fill="#ffffff"/><text x="360" y="42" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700">Monthly rainfall (mm)</text><line x1="88" y1="360" x2="672" y2="360" stroke="#18212a" stroke-width="2"/><line x1="88" y1="72" x2="88" y2="360" stroke="#18212a" stroke-width="2"/><g fill="#aeb7c0"><rect x="130" y="108" width="86" height="252"/><rect x="270" y="12" width="86" height="348"/><rect x="410" y="54" width="86" height="306"/><rect x="550" y="66" width="86" height="294"/></g><g font-family="Arial, sans-serif" font-size="18" fill="#18212a"><text x="173" y="388" text-anchor="middle">Jan</text><text x="313" y="388" text-anchor="middle">Feb</text><text x="453" y="388" text-anchor="middle">Mar</text><text x="593" y="388" text-anchor="middle">Apr</text><text x="173" y="100" text-anchor="middle">42</text><text x="313" y="4" text-anchor="middle">58</text><text x="453" y="46" text-anchor="middle">51</text><text x="593" y="58" text-anchor="middle">49</text></g></svg>