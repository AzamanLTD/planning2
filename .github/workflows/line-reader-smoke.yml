name: Line Reader smoke

on:
  pull_request:
    paths:
      - 'index.html'
      - 'app.js'
      - 'keyboard.js'
      - 'line-reader-enhancement.js'
      - 'line-reader-enhancement.css'
      - 'styles-tokens.css'
      - 'tests/line-reader-contract.test.js'
      - 'tests/line-reader-smoke.html'
  workflow_dispatch:

concurrency:
  group: line-reader-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v5
      - name: Run Line Reader contract
        run: node tests/line-reader-contract.test.js
      - name: Run Line Reader browser smoke
        run: |
          set -eu
          python3 -m http.server 8090 --bind 127.0.0.1 >/tmp/azaman-line-reader-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          sleep 1
          timeout 45s chromium --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage \
            --virtual-time-budget=8000 --dump-dom http://127.0.0.1:8090/tests/line-reader-smoke.html > /tmp/azaman-line-reader-smoke.html
          cat /tmp/azaman-line-reader-smoke.html
          grep -q 'LINE READER SMOKE COMPLETE' /tmp/azaman-line-reader-smoke.html
