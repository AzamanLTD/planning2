name: UI answer-run smoke

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ui-answer-run-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Run UI answer-run smoke
        run: |
          set -eu
          python3 -m http.server 8084 >/tmp/azaman-ui-answer-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          sleep 1
          chromium --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --virtual-time-budget=20000 --dump-dom http://127.0.0.1:8084/tests/ui-answer-run-smoke.html > /tmp/azaman-ui-answer-smoke.html
          cat /tmp/azaman-ui-answer-smoke.html
          grep -q 'UI ANSWER-RUN SMOKE COMPLETE' /tmp/azaman-ui-answer-smoke.html
