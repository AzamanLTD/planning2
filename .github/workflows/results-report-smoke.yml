name: Results report smoke

on:
  pull_request:
    paths:
      - 'index.html'
      - 'app.js'
      - 'session-guard.js'
      - 'results-enhancement.js'
      - 'results-download-enhancement.js'
      - 'results-domain-report.css'
      - 'results-question-review.css'
      - 'tests/results-report-smoke.html'
      - 'tests/results-domain-report-contract.test.js'
      - 'tests/results-download-contract.test.js'
      - '.github/workflows/results-report-smoke.yml'
  workflow_dispatch:

concurrency:
  group: results-report-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Validate results contracts
        run: |
          node tests/results-domain-report-contract.test.js
          node tests/results-download-contract.test.js
      - name: Run results report browser smoke
        run: |
          set -eu
          python3 -m http.server 8092 --bind 127.0.0.1 >/tmp/azaman-results-report-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          sleep 1
          timeout 60s chromium --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage \
            --virtual-time-budget=10000 --dump-dom http://127.0.0.1:8092/tests/results-report-smoke.html \
            > /tmp/azaman-results-report-smoke.html
          cat /tmp/azaman-results-report-smoke.html
          grep -q 'RESULTS REPORT SMOKE COMPLETE' /tmp/azaman-results-report-smoke.html
