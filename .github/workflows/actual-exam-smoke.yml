name: Actual exam model smoke

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: actual-exam-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Run actual exam browser smoke
        run: |
          set -eu
          python3 -m http.server 8087 >/tmp/azaman-actual-exam-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          sleep 1
          timeout 45s chromium --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --site-per-process --timeout=15000 --dump-dom http://127.0.0.1:8087/tests/actual-exam-smoke.html > /tmp/azaman-actual-exam-smoke.html
          cat /tmp/azaman-actual-exam-smoke.html
          grep -q 'ACTUAL EXAM SMOKE COMPLETE' /tmp/azaman-actual-exam-smoke.html
          ! grep -q '<script' /tmp/azaman-actual-exam-smoke.html
