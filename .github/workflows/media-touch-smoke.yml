name: Media touch smoke

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: media-touch-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v5
      - name: Run media touch browser smoke
        run: |
          set -eu
          python3 -m http.server 8088 --bind 127.0.0.1 >/tmp/azaman-media-touch-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          sleep 1
          timeout 45s chromium --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --virtual-time-budget=20000 --dump-dom http://127.0.0.1:8088/tests/media-touch-smoke.html > /tmp/azaman-media-touch-smoke.html
          cat /tmp/azaman-media-touch-smoke.html
          grep -q 'MEDIA TOUCH SMOKE COMPLETE' /tmp/azaman-media-touch-smoke.html
