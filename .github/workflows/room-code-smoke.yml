name: Room code smoke

on:
  pull_request:
    paths:
      - 'index.html'
      - 'app.js'
      - 'room-code-enhancement.js'
      - 'tests/room-code-smoke.html'
      - '.github/workflows/room-code-smoke.yml'
  workflow_dispatch:

concurrency:
  group: room-code-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v5
      - name: Run room code browser smoke
        run: |
          set -eu
          python3 -m http.server 8090 --bind 127.0.0.1 >/tmp/azaman-room-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          sleep 1
          timeout 60s chromium --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage \
            --virtual-time-budget=12000 --dump-dom http://127.0.0.1:8090/tests/room-code-smoke.html \
            > /tmp/azaman-room-smoke.html
          cat /tmp/azaman-room-smoke.html
          grep -q 'ROOM CODE SMOKE COMPLETE' /tmp/azaman-room-smoke.html
