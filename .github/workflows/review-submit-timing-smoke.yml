name: Review submit timing smoke

on:
  pull_request:
    paths:
      - 'index.html'
      - 'app.js'
      - 'session-guard.js'
      - 'review-submit-timing-enhancement.js'
      - 'tests/review-submit-timing-contract.test.js'
      - 'tests/review-submit-timing-smoke.html'
      - 'tests/full-run-smoke.html'
      - '.github/workflows/review-submit-timing-smoke.yml'
  workflow_dispatch:

concurrency:
  group: review-submit-timing-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false
      - name: Validate review timing contract
        run: node tests/review-submit-timing-contract.test.js
      - name: Run review submit timing browser smoke
        run: |
          set -eu
          python3 -m http.server 8093 --bind 127.0.0.1 >/tmp/azaman-review-submit-timing-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          sleep 1
          timeout 60s chromium --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage \
            --virtual-time-budget=10000 --dump-dom http://127.0.0.1:8093/tests/review-submit-timing-smoke.html \
            > /tmp/azaman-review-submit-timing-smoke.html
          cat /tmp/azaman-review-submit-timing-smoke.html
          grep -q 'REVIEW SUBMIT TIMING SMOKE COMPLETE' /tmp/azaman-review-submit-timing-smoke.html
