name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  contract-and-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Verify canonical app entrypoint
        run: node tests/entrypoint-contract.test.js
      - name: Validate question-bank records and distribution
        run: node tests/question-bank-contract.test.js
      - name: Validate question content and provenance
        run: node tests/question-content-contract.test.js
      - name: Audit content diversity
        run: node tests/content-diversity-audit.test.js
      - name: Validate adaptive Module 2 variants
        run: node tests/adaptive-integrity.test.js
      - name: Validate curated hard Math SPR variants
        run: node tests/math-hard-override.test.js
      - name: Audit MCQ answer-position balance
        run: node tests/answer-distribution-audit.test.js
      - name: Verify MCQ answer mapping integrity
        run: node tests/answer-position-integrity.test.js
      - name: Validate calculator safety and capabilities
        run: node tests/calculator-contract.test.js
      - name: Validate note editor and UI sanitization contracts
        run: node tests/note-and-sanitizer-contract.test.js
      - name: Validate reference sheet and exam-tool contracts
        run: node tests/tools-contract.test.js
      - name: Validate media, tool-movement, calculator, Line Reader, reference keyboard, highlight/notes, navigation accessibility, and source table contracts
        run: |
          node tests/media-schema-contract.test.js
          node tests/media-touch-contract.test.js
          node tests/tool-move-contract.test.js
          node tests/line-reader-contract.test.js
          node tests/reference-keyboard-contract.test.js
          node tests/highlight-notes-parity.test.js
          node tests/navigation-a11y-contract.test.js
          node tests/source-table-a11y-contract.test.js
      - name: Validate GitHub Pages deployment contract
        run: node tests/pages-deploy-contract.test.js
      - name: Prevent obsolete enhancement layers
        run: node tests/legacy-layer-contract.test.js
      - name: Run static application contract checks
        run: node tests/static-contract.test.js
      - name: Validate full-run smoke contract
        run: node tests/full-run-contract.test.js
      - name: Validate QA matrix contract
        run: node tests/qa-matrix-contract.test.js
      - name: Run accessibility contract checks
        run: node tests/accessibility-contract.test.js
      - name: Run session SRP contract checks
        run: node tests/session-srp-contract.test.js
      - name: Run deployment smoke checks
        run: node tests/deployment-contract.test.js
      - name: Run UI smoke test
        run: node tests/ui-answer-run.test.js
      - name: Run Help smoke test
        run: node tests/help-smoke.test.js
      - name: Run complete 98-question Chromium smoke
        run: node tests/full-run-browser-smoke.js
      - name: Run 390px mobile smoke
        run: node tests/mobile-390-smoke.js
