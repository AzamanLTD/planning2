name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false
      - name: Check JavaScript syntax
        run: |
          set -eu
          for file in $(find . -name '*.js' -not -path './node_modules/*' | sort); do
            echo "Checking $file"
            node --check "$file"
          done
      - name: Validate question-bank shape and coverage
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const files = ['data/questions.js', 'data/rw2-easy.js', 'data/rw-source-overrides.js', 'data/question-quality-overrides.js'];
          const sandbox = {};
          for (const path of files) new Function('window', fs.readFileSync(path, 'utf8'))(sandbox);
          const b = sandbox.SAT_QUESTIONS;
          const groups = [
            ['rw1', b.rw1], ['rw2.easy', b.rw2.easy], ['rw2.hard', b.rw2.hard],
            ['math1', b.math1], ['math2.easy', b.math2.easy], ['math2.hard', b.math2.hard]
          ];
          const expected = [27, 27, 27, 22, 22, 22];
          groups.forEach(([name, items], i) => {
            if (!Array.isArray(items) || items.length !== expected[i]) throw new Error(`${name} count mismatch`);
          });
          const all = groups.flatMap(([, items]) => items);
          if (all.length !== 147) throw new Error(`expected 147 records, got ${all.length}`);
          const ids = new Set();
          for (const q of all) {
            if (ids.has(q.id)) throw new Error(`duplicate question id: ${q.id}`);
            ids.add(q.id);
            if (!q.id || !q.prompt || !q.answer || !q.difficulty || !q.domain || !q.skill || !q.explanation) throw new Error(`missing metadata: ${q.id}`);
            if (q.section === 'Reading and Writing' && (!Array.isArray(q.options) || q.options.length !== 4)) throw new Error(`R&W options mismatch: ${q.id}`);
            if (q.section === 'Math' && q.type === 'mcq' && (!Array.isArray(q.options) || q.options.length !== 4)) throw new Error(`Math MCQ options mismatch: ${q.id}`);
            if (q.section === 'Math' && q.type === 'spr' && q.options?.length) throw new Error(`SPR should not carry MCQ options: ${q.id}`);
            if (q.section === 'Reading and Writing') {
              const words = q.source?.paragraphs?.join(' ').trim().split(/\s+/).filter(Boolean).length || 0;
              if (words > 150 || words < 25) throw new Error(`R&W source outside 25-150 word window: ${q.id} (${words})`);
            }
          }
          const spr = all.filter(q => q.section === 'Math' && q.type === 'spr').length;
          if (spr < 10 || spr > 20) throw new Error(`unexpected SPR volume: ${spr}`);
          const rw2Hard = b.rw2.hard.filter(q => q.difficulty === 'hard').length;
          if (rw2Hard !== 27) throw new Error(`R&W hard Module 2 should be fully hard-tagged: ${rw2Hard}/27`);
          const math2Hard = b.math2.hard.filter(q => q.difficulty === 'hard').length;
          if (math2Hard !== 22) throw new Error(`Math hard Module 2 should be fully hard-tagged: ${math2Hard}/22`);
          const ranges = {
            'Reading and Writing': {
              'Craft and Structure': [7, 9], 'Information and Ideas': [6, 8],
              'Standard English Conventions': [6, 8], 'Expression of Ideas': [4, 6]
            },
            Math: { Algebra: [6, 9], 'Advanced Math': [6, 8], 'Problem Solving and Data Analysis': [3, 5], 'Geometry and Trigonometry': [3, 5] }
          };
          const moduleDomainCounts = (items, section) => {
            const counts = Object.fromEntries(Object.keys(ranges[section]).map(k => [k, 0]));
            for (const q of items) counts[q.domain] = (counts[q.domain] || 0) + 1;
            for (const [domain, [min, max]] of Object.entries(ranges[section])) {
              if (counts[domain] < min || counts[domain] > max) throw new Error(`${section} domain distribution out of range: ${domain}=${counts[domain]} (expected ${min}-${max})`);
            }
            return counts;
          };
          for (const [name, items] of groups) console.log(`${name} domain coverage: ${JSON.stringify(moduleDomainCounts(items, items[0].section))}`);
          console.log(`Validated ${all.length} effective records, ${spr} Math SPR items, unique IDs.`);
          NODE
      - name: Run automated content audit
        run: node tests/content-audit.test.js
      - name: Verify authored R&W source override coverage
        run: node tests/content-override-contract.test.js
      - name: Audit question-bank diversity
        run: node tests/content-diversity-audit.test.js
      - name: Validate adaptive Module 2 variants
        run: node tests/adaptive-integrity.test.js
      - name: Validate curated hard Math SPR variants
        run: node tests/math-hard-override.test.js
      - name: Audit MCQ answer-position balance
        run: node tests/answer-distribution-audit.test.js
      - name: Verify MCQ answer mapping integrity
        run: node tests/answer-position-integrity.test.js
      - name: Validate calculator safety and capabilities
        run: node tests/calculator-contract.test.js
      - name: Validate note editor and UI sanitization contracts
        run: node tests/note-and-sanitizer-contract.test.js
      - name: Validate reference sheet and exam-tool contracts
        run: node tests/tools-contract.test.js
      - name: Run static application contract checks
        run: node tests/static-contract.test.js
      - name: Run accessibility contract checks
        run: node tests/accessibility-contract.test.js
      - name: Run session recovery edge-case tests
        run: node tests/session-guard.test.js
      - name: Run Chromium browser smoke test
        run: |
          set -eu
          python3 -m http.server 8080 >/tmp/azaman-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          sleep 1
          chromium --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --virtual-time-budget=10000 --dump-dom http://127.0.0.1:8080/tests/browser-smoke.html > /tmp/azaman-smoke.html
          cat /tmp/azaman-smoke.html
          grep -q 'SMOKE COMPLETE' /tmp/azaman-smoke.html
