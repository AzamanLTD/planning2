name: Unscheduled break smoke

on:
  pull_request:
    paths:
      - 'index.html'
      - 'unscheduled-break-enhancement.js'
      - 'tests/unscheduled-break-contract.test.js'
      - 'tests/unscheduled-break-smoke.html'
      - '.github/workflows/unscheduled-break-smoke.yml'
  workflow_dispatch:

concurrency:
  group: unscheduled-break-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false
      - name: Validate unscheduled break contract
        run: node tests/unscheduled-break-contract.test.js
      - name: Run unscheduled break browser smoke
        run: |
          set -eu
          python3 -m http.server 8094 --bind 127.0.0.1 >/tmp/azaman-unscheduled-break-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          sleep 1
          timeout 60s chromium --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage \
            --virtual-time-budget=10000 --dump-dom http://127.0.0.1:8094/tests/unscheduled-break-smoke.html \
            > /tmp/azaman-unscheduled-break-smoke.html
          cat /tmp/azaman-unscheduled-break-smoke.html
          grep -q 'UNSCHEDULED BREAK SMOKE COMPLETE' /tmp/azaman-unscheduled-break-smoke.html
