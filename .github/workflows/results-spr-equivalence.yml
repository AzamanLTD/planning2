name: Results SPR equivalence smoke

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: results-spr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Run results SPR equivalence smoke
        run: |
          set -eu
          python3 -m http.server 8084 >/tmp/azaman-results-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          sleep 1
          chromium --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --virtual-time-budget=5000 --dump-dom http://127.0.0.1:8084/tests/results-spr-equivalence-smoke.html > /tmp/azaman-results-smoke.html
          cat /tmp/azaman-results-smoke.html
          grep -q 'RESULTS SPR EQUIVALENCE COMPLETE' /tmp/azaman-results-smoke.html
