name: Timer warning recovery smoke

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: timer-warning-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Run timer warning recovery smoke
        run: |
          set -eu
          python3 -m http.server 8083 >/tmp/azaman-timer-warning-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          sleep 1
          chromium --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --virtual-time-budget=5000 --dump-dom http://127.0.0.1:8083/tests/timer-warning-recovery-smoke.html > /tmp/azaman-timer-warning-smoke.html
          cat /tmp/azaman-timer-warning-smoke.html
          grep -q 'TIMER WARNING RECOVERY COMPLETE' /tmp/azaman-timer-warning-smoke.html
