<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Tool move keyboard smoke</title><link rel="stylesheet" href="../styles.css"></head>
<body>
  <main id="app"><p>Tool move keyboard smoke</p></main>
  <script>
    localStorage.setItem('azaman-sat-practice-v3', JSON.stringify({
      v: 3, screen: 'test', student: 'Move Smoke', accessCode: 'SAT26', roomCode: 'AZM24', startCode: '492776',
      mi: 2, qi: 0, answers: {}, marked: {}, eliminated: {}, notes: {}, highlights: {},
      endAt: Date.now() + 600000, breakEndAt: null, completed: { rw1: true, rw2: true }, submitted: false,
      timerHidden: false, lineReader: false, rules: true, desk: true, rulesOk: true, harness: true, setupDone: true, warning: {},
      adaptive: { rw: 'easy', math: 'easy' }
    }));
  </script>
  <script src="../data/questions.js"></script>
  <script src="../data/rw2-easy.js"></script>
  <script src="../data/rw-source-overrides.js"></script>
  <script src="../data/question-quality-overrides.js"></script>
  <script src="../data/media-overrides.js"></script>
  <script src="../session-guard.js"></script>
  <script src="../exam-ui-sanitizer.js"></script>
  <script src="../app.js"></script>
  <script src="../keyboard.js"></script>
  <script src="../spr-input.js"></script>
  <script src="../tools-enhancement.js"></script>
  <script src="../note-enhancement.js"></script>
  <script src="../modal-enhancement.js"></script>
  <script src="../calculator-enhancement.js"></script>
  <script src="../code-input-enhancement.js"></script>
  <script src="../results-enhancement.js"></script>
  <script src="../ui-accessibility-enhancement.js"></script>
  <script src="../media-enhancement.js"></script>
  <script src="../tools-move-enhancement.js"></script>
  <script>
    const fail = (message) => { throw new Error(message); };
    const waitFor = (selector) => new Promise((resolve) => {
      const find = () => {
        const value = document.querySelector(selector);
        if (value) resolve(value); else setTimeout(find, 50);
      };
      find();
    });
    const exerciseMove = async (panelId, openerPattern, directionKey) => {
      const open = [...document.querySelectorAll('button')].find((button) => openerPattern.test(button.textContent || button.getAttribute('aria-label') || ''));
      if (!open) fail(`${panelId} opener missing`);
      open.click();
      const panel = await waitFor(`#${panelId}`);
      const move = panel.querySelector('.azm-move-button');
      if (!move) fail(`${panelId} move button missing`);
      if (move.getAttribute('aria-pressed') !== 'false') fail(`${panelId} move initial state incorrect`);
      const rectBefore = panel.getBoundingClientRect();
      move.click();
      if (move.getAttribute('aria-pressed') !== 'true') fail(`${panelId} move button did not enter pressed state`);
      move.dispatchEvent(new KeyboardEvent('keydown', { key: directionKey, bubbles: true }));
      const rectAfter = panel.getBoundingClientRect();
      const moved = directionKey === 'ArrowRight' ? rectAfter.left > rectBefore.left : rectAfter.top > rectBefore.top;
      if (!moved) fail(`${panelId} did not move for ${directionKey}: ${rectBefore.left},${rectBefore.top} -> ${rectAfter.left},${rectAfter.top}`);
      move.dispatchEvent(new KeyboardEvent('keydown', { key: 'Escape', bubbles: true }));
      if (move.getAttribute('aria-pressed') !== 'false') fail(`${panelId} Escape did not leave move mode`);
      panel.querySelector('.panel-head .icon-btn')?.click();
    };

    setTimeout(async () => {
      try {
        await exerciseMove('calculatorPanel', /calculator/i, 'ArrowRight');
        await exerciseMove('referencePanel', /reference/i, 'ArrowDown');
        document.body.insertAdjacentHTML('beforeend', '<p id="move-pass">TOOL MOVE KEYBOARD SMOKE COMPLETE</p>');
      } catch (error) {
        document.body.insertAdjacentHTML('beforeend', `<pre id="move-fail">${String(error.message || error)}</pre>`);
        throw error;
      }
    }, 250);
  </script>
</body>
</html>
