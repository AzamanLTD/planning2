<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Azaman room code smoke</title></head>
<body>
  <pre id="result">running</pre>
  <iframe id="app" title="Azaman simulator" style="width:100%;height:500px;border:0"></iframe>
  <script>
    (() => {
      const out = document.getElementById('result');
      const frame = document.getElementById('app');
      const KEY = 'azaman-sat-practice-v3';
      const baseState = () => ({ v: 3, screen: 'checkin', step: 3, student: 'Room Code Smoke', email: 'room@example.com', accessCode: 'SAT26', roomCode: '', startCode: '', mi: 0, qi: 0, endAt: null, breakEndAt: null, answers: {}, marked: {}, eliminated: {}, notes: {}, highlights: {}, completed: {}, submitted: false, adaptive: { rw: 'easy', math: 'easy' }, timerHidden: false, lineReader: false, rules: true, desk: true, warning: {} });
      localStorage.setItem(KEY, JSON.stringify(baseState()));
      frame.src = '../index.html?room-code-smoke=' + Date.now();
      function run() {
        const doc = frame.contentDocument;
        try {
          const boxes = doc.querySelectorAll('.room-digit');
          if (boxes.length !== 5) throw new Error(`expected 5 room-code boxes, got ${boxes.length}`);
          // digits are filtered out — a code with a digit stays incomplete, no success yet
          'AZM1P'.split('').forEach((ch, i) => { const b = frame.contentDocument.querySelectorAll('.room-digit')[i]; b.value = ch; b.dispatchEvent(new Event('input', { bubbles: true })); });
          setTimeout(() => {
            try {
              const doc1 = frame.contentDocument;
              if (doc1.querySelector('.success-msg')) throw new Error('incomplete (digit-filtered) room code should not show success yet');
              if (doc1.querySelector('.error-msg')) throw new Error('offline tool must not show an invalid-code error');
              // any five letters is accepted — no exact-match fixture
              'QWRTY'.split('').forEach((ch, i) => { const b = frame.contentDocument.querySelectorAll('.room-digit')[i]; b.value = ch; b.dispatchEvent(new Event('input', { bubbles: true })); });
              setTimeout(() => {
                try {
                  const doc2 = frame.contentDocument;
                  if (!doc2.querySelector('.success-msg')) throw new Error('five-letter room code did not surface the success message');
                  doc2.querySelector('#wizNext').click();
                  setTimeout(() => {
                    try {
                      const next = JSON.parse(localStorage.getItem(KEY));
                      if (next?.step !== 4) throw new Error(`expected wizard step 4 after room code, got ${next?.step}`);
                      if (next?.roomCode !== 'QWRTY') throw new Error(`room code not stored as typed: ${next?.roomCode || '(empty)'}`);
                      out.textContent = 'PASS digit filtering, accept-any success message, wizard advancement, five-letter room boxes\nROOM CODE SMOKE COMPLETE';
                    } catch (error) { out.textContent = `FAIL ${error.message}`; }
                    finally { frame.remove(); }
                  }, 80);
                } catch (error) { out.textContent = `FAIL ${error.message}`; frame.remove(); }
              }, 80);
            } catch (error) { out.textContent = `FAIL ${error.message}`; frame.remove(); }
          }, 80);
        } catch (error) { out.textContent = `FAIL ${error.message}`; frame.remove(); }
      }
      const waiter = setInterval(() => {
        try { const doc = frame.contentDocument; if (doc?.readyState === 'complete' && doc.getElementById('app')) { clearInterval(waiter); setTimeout(run, 100); } } catch (_) {}
      }, 50);
    })();
  </script>
</body>
</html>
