<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Results choice smoke</title></head>
<body>
<pre id="result">running</pre>
<script>
(async () => {
  try {
    const response = await fetch('../index.html');
    if (!response.ok) throw new Error('entrypoint unavailable');
    const html = await response.text();
    for (const required of ['results-choice-breakdown.css','results-choice-breakdown-enhancement.js','results-enhancement.js']) {
      if (!html.includes(required)) throw new Error(`missing ${required}`);
    }
    document.getElementById('result').textContent = 'PASS choice breakdown assets are wired into the production entrypoint\\nRESULTS CHOICE BREAKDOWN SMOKE COMPLETE';
  } catch (error) {
    document.getElementById('result').textContent = `FAIL ${error.message}`;
  }
})();
</script>
</body>
</html>
