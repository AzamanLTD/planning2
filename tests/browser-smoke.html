<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Azaman browser smoke</title></head>
<body>
  <pre id="result">running</pre>
  <iframe id="app" title="Azaman simulator" style="width:100%;height:800px;border:0"></iframe>
  <script>
    (() => {
      'use strict';
      const out = document.getElementById('result');
      const frame = document.getElementById('app');
      const KEY = 'azaman-sat-practice-v3';
      const checks = [];
      let done = false;

      const check = (name, value) => {
        checks.push(`${value ? 'PASS' : 'FAIL'} ${name}`);
        if (!value) throw new Error(name);
      };
      const wait = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
      const readState = () => JSON.parse(frame.contentWindow.localStorage.getItem(KEY));
      const baseState = () => ({
        v: 3, screen: 'test', student: 'Smoke Student', email: 'smoke@example.com', password: '',
        accessCode: 'SAT26', roomCode: 'AZM24', startCode: '492776', step: 10, setupStep: 1,
        setupDone: true, infoCorrect: 'yes', deviceOk: 'yes', rulesOk: true, checkinRules: true,
        harness: true, infoOk: true, aids: {}, pledge: '', roomOk: true, mi: 0, qi: 0,
        endAt: Date.now() + 600000, breakEndAt: null, answers: {}, marked: {}, eliminated: {},
        notes: {}, highlights: {}, completed: {}, submitted: false,
        adaptive: { rw: 'easy', math: 'easy' }, timerHidden: false, lineReader: false,
        rules: true, desk: true, warning: {}, completedAt: null
      });

      async function run() {
        frame.src = '../index.html?browser-smoke=1';
        await new Promise((resolve) => { frame.onload = resolve; });
        frame.contentWindow.localStorage.setItem(KEY, JSON.stringify(baseState()));
        frame.contentWindow.location.reload();
        await wait(300);

        let doc = frame.contentDocument;
        const win = frame.contentWindow;
        check('module 1 renders', /Reading and Writing/.test(doc.querySelector('.test-title')?.textContent || ''));
        check('27-question module', /Question 1 of 27/.test(doc.querySelector('.question-nav')?.textContent || ''));
        check('preview banner renders in harness', doc.querySelector('.preview-banner')?.textContent.trim() === 'THIS IS A TEST PREVIEW');
        check('student metadata row removed from exam view', !doc.querySelector('.q-meta'));
        check('student UI labels passage as source', doc.querySelector('.source-label')?.textContent.trim() === 'Source');
        check('answer choices expose radio semantics', doc.querySelector('.choice')?.getAttribute('role') === 'radio');
        check('question prompt is keyboard focusable', doc.querySelector('#questionPrompt')?.tabIndex >= 0);

        const firstChoice = doc.querySelector('.choice');
        const firstLetter = firstChoice?.dataset.answer;
        firstChoice?.click();
        await wait(80);
        check('answer click persists keyed letter', readState().answers['rw1-0'] === firstLetter);
        check('clicked answer is selected', doc.querySelector(`.choice[data-answer="${firstLetter}"]`)?.getAttribute('aria-pressed') === 'true');

        doc.querySelector('#markBtn')?.click();
        await wait(80);
        check('mark for review persists', !!readState().marked['rw1-0']);

        doc.querySelector('#notesToolBtn')?.click();
        await wait(80);
        const note = doc.getElementById('azmNoteEditor');
        check('notes editor opens', !!note);
        const field = note?.querySelector('#noteEditorText');
        check('notes field is editable', !!field && !field.readOnly);
        field.value = 'UI smoke note';
        field.dispatchEvent(new Event('input', { bubbles: true }));
        note.querySelector('#noteEditorSave')?.click();
        await wait(80);
        check('notes editor saves through UI', readState().notes['rw1-0'] === 'UI smoke note');

        doc = frame.contentDocument;
        doc.dispatchEvent(new KeyboardEvent('keydown', { key: 'F1', bubbles: true, cancelable: true }));
        await wait(50);
        check('F1 opens keyboard shortcut help', !!doc.getElementById('shortcutHelp'));
        doc.dispatchEvent(new KeyboardEvent('keydown', { key: 'Escape', bubbles: true, cancelable: true }));
        check('Escape closes keyboard shortcut help', !doc.getElementById('shortcutHelp'));

        doc.querySelector('#toolsBtn')?.click();
        await wait(50);
        check('More tools menu opens', !!doc.getElementById('toolPopover'));
        check('Assistive Technology tool is exposed', !!doc.querySelector('#atTool'));
        doc.querySelector('#atTool')?.click();
        await wait(50);
        check('Assistive Technology dialog opens', !!doc.getElementById('atModal'));
        check('Assistive Technology has Expand All', [...(doc.getElementById('atModal')?.querySelectorAll('button') || [])].some(b => b.textContent.trim() === 'Expand All'));
        doc.getElementById('atRef2Done')?.click();

        const current = readState();
        current.qi = 26;
        current.endAt = Date.now() + 600000;
        frame.contentWindow.localStorage.setItem(KEY, JSON.stringify(current));
        frame.contentWindow.location.reload();
        await wait(250);
        doc = frame.contentDocument;
        check('last question reachable', /Question 27 of 27/.test(doc.querySelector('.question-nav')?.textContent || ''));
        doc.querySelector('#nextBtn')?.click();
        await wait(60);
        check('review modal opens at module end', !!doc.getElementById('reviewModal'));
        check('review dialog has accessible label', !!doc.getElementById('reviewModal')?.getAttribute('aria-labelledby'));
        check('review modal contains module completion action', !!doc.querySelector('#submitModule'));

        const finalState = readState();
        finalState.completed.rw1 = false;
        finalState.endAt = Date.now() + 600000;
        frame.contentWindow.localStorage.setItem(KEY, JSON.stringify(finalState));
        check('storage state remains recoverable', !!readState() && readState().mi === 0 && readState().qi === 26);

        done = true;
        out.textContent = checks.join('\n') + '\nSMOKE COMPLETE';
      }

      window.addEventListener('error', (event) => {
        if (done) return;
        out.textContent = `FAIL ${event.message || 'browser error'}\n${checks.join('\n')}`;
      });

      run().catch((error) => {
        out.textContent = `FAIL ${error.message || error}\n${checks.join('\n')}`;
      });
    })();
  </script>
</body>
</html>
