<!doctype html><meta charset="utf-8"><title>Actual exam smoke</title><pre id="result">running</pre><script>
(()=>{const K='azaman-sat-practice-v3',out=document.getElementById('result'),checks=[];let f=null;const wait=ms=>new Promise(r=>setTimeout(r,ms));const check=(n,x)=>{checks.push((x?'PASS ':'FAIL ')+n);if(!x)throw Error(n)};const st=()=>JSON.parse(f.contentWindow.localStorage.getItem(K)||'null');const base={v:3,screen:'test',student:'Actual Smoke Student',email:'actual@example.com',password:'',accessCode:'SAT26',roomCode:'AZM24',startCode:'492776',step:10,setupStep:1,setupDone:true,infoCorrect:'yes',deviceOk:'yes',infoOk:true,rulesOk:true,checkinRules:true,aids:{},pledge:'',mi:0,qi:0,endAt:Date.now()+600000,breakEndAt:null,answers:{},marked:{},eliminated:{},notes:{},highlights:{},completed:{},submitted:false,adaptive:{rw:'easy',math:'easy'},timerHidden:false,lineReader:false,rules:true,desk:true,warning:{},harness:false};const fresh=()=>{if(f)f.remove();f=document.createElement('iframe');f.style.cssText='width:1px;height:1px;border:0';document.body.appendChild(f)};const load=async(state,sel)=>{fresh();await new Promise((resolve,reject)=>{const timer=setTimeout(()=>reject(Error('initial iframe load timeout')),8000);f.addEventListener('load',()=>{clearTimeout(timer);resolve()},{once:true});f.src='../index.html?smoke='+Date.now()});f.contentWindow.localStorage.setItem(K,JSON.stringify(state));await new Promise((resolve,reject)=>{const timer=setTimeout(()=>reject(Error('reload timeout')),8000);f.addEventListener('load',()=>{clearTimeout(timer);resolve()},{once:true});f.contentWindow.location.reload()});await wait(300);const d=f.contentDocument;if(!d?.querySelector(sel))throw Error('missing '+sel);return d};const cleanup=()=>{if(f){f.remove();f=null}};
async function start(){const d=await load({...base,screen:'checkin',step:8,endAt:null},'#azmStartCodePage');check('start code surface renders',!!d.getElementById('azmStartCodePage'));check('numbers-only instruction',/numbers only/i.test(d.getElementById('azmStartCodePage').textContent));check('six input boxes',d.querySelectorAll('.azm-start-digit').length===6);check('start test control',!!d.getElementById('azmStartTest'));d.querySelectorAll('.azm-start-digit').forEach((x,i)=>{x.value=base.startCode[i];x.dispatchEvent(new Event('input',{bubbles:true}))});d.getElementById('azmStartTest').click();await wait(150);check('start enters directions',st().screen==='directions'&&st().mi===0)}
async function recovery(){const d=await load({...base,screen:'signin',mi:2,qi:7,endAt:Date.now()+241000,recovery:{remainingMs:241000,expiresAt:Date.now()+600000},answers:{'rw1-0':'A'}},'#azmRecoveryNotice');check('recovery notice',!!d.getElementById('azmRecoveryNotice'));d.getElementById('email').value=base.email;d.getElementById('email').dispatchEvent(new Event('input',{bubbles:true}));d.getElementById('password').value='resume';d.getElementById('password').dispatchEvent(new Event('input',{bubbles:true}));d.getElementById('signinBtn').click();await wait(150);check('recovery resumes test',st().screen==='test'&&st().mi===2&&st().qi===7);const s=st();check('recovery clears',!s.recovery);check('deadline restored',s.endAt>Date.now()+230000);check('answers survive',s.answers['rw1-0']==='A')}
async function gate(){const d=await load({...base,screen:'test',mi:0,qi:26,endAt:Date.now()+240000},'.test-shell');check('preview banner hidden',getComputedStyle(d.querySelector('.preview-banner')).display==='none');d.getElementById('nextBtn').click();await wait(100);const s=st();check('early advance blocked',s.mi===0&&s.qi===26&&s.screen==='test');check('gate appears',!!d.getElementById('azmExamGate'));check('review modal absent',!d.getElementById('reviewModal'))}
async function brk(){const d=await load({...base,screen:'break',mi:2,breakEndAt:Date.now()+3000,completed:{rw1:true,rw2:true,math1:false,math2:false}},'#azmBreakPage');check('break surface',!!d.getElementById('azmBreakPage'));check('break rules',/Follow these rules during the break/i.test(d.getElementById('azmBreakPage').textContent));d.getElementById('azmResumeBtn').click();await wait(150);check('resume enters math directions',st().screen==='directions'&&st().mi===2&&!st().breakEndAt)}
async function finish(){const d=await load({...base,screen:'finish',mi:3,completed:{rw1:true,rw2:true,math1:true,math2:true},submitted:true},'#azmSubmissionScreen');check('submission surface',!!d.getElementById('azmSubmissionScreen'));check('congratulations',d.querySelector('.azm-congrats-card h1')?.textContent==='Congratulations!');check('completion copy',/test is complete, and your answers have been submitted/i.test(d.querySelector('.azm-congrats-sub')?.textContent||''));check('proctor instruction',/proctor/i.test(d.querySelector('.azm-congrats-copy')?.textContent||''))}
(async()=>{try{await start();cleanup();await recovery();cleanup();await gate();cleanup();await brk();cleanup();await finish();out.textContent=checks.join('\n')+'\nACTUAL EXAM SMOKE COMPLETE'}catch(e){out.textContent=checks.join('\n')+'\nFAIL '+e.message}finally{cleanup()}})()})();
</script>
