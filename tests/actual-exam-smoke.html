<!doctype html><meta charset="utf-8"><title>Actual exam smoke</title><pre id="result">running</pre><script>
(()=>{const K='azaman-sat-practice-v3',out=document.getElementById('result'),checks=[];let f=null;const wait=ms=>new Promise(r=>setTimeout(r,ms));const check=(n,x)=>{checks.push((x?'PASS ':'FAIL ')+n);if(!x)throw Error(n)};const st=()=>JSON.parse(localStorage.getItem(K)||'null');const base={v:3,screen:'test',student:'Actual Smoke Student',email:'actual@example.com',password:'',accessCode:'SAT26',roomCode:'AZM24',startCode:'492776',step:10,setupStep:1,setupDone:true,infoCorrect:'yes',deviceOk:'yes',infoOk:true,roomOk:true,rulesOk:true,checkinRules:true,aids:{},pledge:'',mi:0,qi:0,endAt:Date.now()+600000,breakEndAt:null,answers:{},marked:{},eliminated:{},notes:{},highlights:{},completed:{},submitted:false,adaptive:{rw:'easy',math:'easy'},timerHidden:false,lineReader:false,rules:true,desk:true,warning:{},harness:false};const write=x=>localStorage.setItem(K,JSON.stringify(x));const fresh=()=>{if(f)f.remove();f=document.createElement('iframe');f.style.cssText='width:1px;height:1px;border:0';document.body.appendChild(f);return f};const waitSel=async(sel,ms=6000)=>{const t=Date.now();for(;;){const d=f.contentDocument;if(d?.querySelector(sel))return d;if(Date.now()-t>ms)throw Error('timeout '+sel+' body='+(d?.body?.textContent||'').slice(0,300));await wait(50)}};const load=sel=>{fresh().src='../index.html?smoke='+Date.now();return waitSel(sel)};const cleanup=()=>{if(f){f.remove();f=null}};
async function start(){write({...base,screen:'checkin',step:8,endAt:null});const d=await load('#azmStartCodePage');check('start code surface renders',!!d.getElementById('azmStartCodePage'));check('numbers-only instruction',/numbers only/i.test(d.getElementById('azmStartCodePage').textContent));check('six input boxes',d.querySelectorAll('.azm-start-digit').length===6);check('start test control',!!d.getElementById('azmStartTest'));d.querySelectorAll('.azm-start-digit').forEach((x,i)=>{x.value=base.startCode[i];x.dispatchEvent(new Event('input',{bubbles:true}))});d.getElementById('azmStartTest').click();await waitSel('#azmDirectionsPage');check('start enters directions',st().screen==='directions'&&st().mi===0)}
async function recovery(){write({...base,screen:'signin',mi:2,qi:7,endAt:Date.now()+241000,recovery:{remainingMs:241000,expiresAt:Date.now()+600000},answers:{'rw1-0':'A'}});const d=await load('#azmRecoveryNotice');check('recovery notice',!!d.getElementById('azmRecoveryNotice'));d.getElementById('email').value=base.email;d.getElementById('email').dispatchEvent(new Event('input',{bubbles:true}));d.getElementById('password').value='resume';d.getElementById('password').dispatchEvent(new Event('input',{bubbles:true}));d.getElementById('signinBtn').click();await waitSel('.test-shell');const s=st();check('recovery resumes test',s.screen==='test'&&s.mi===2&&s.qi===7);check('recovery clears',!s.recovery);check('deadline restored',s.endAt>Date.now()+230000);check('answers survive',s.answers['rw1-0']==='A')}
async function gate(){write({...base,screen:'test',mi:0,qi:26,endAt:Date.now()+240000});const d=await load('.test-shell');check('preview banner hidden',getComputedStyle(d.querySelector('.preview-banner')).display==='none');d.getElementById('nextBtn').click();await waitSel('#azmExamGate');const s=st();check('early advance blocked',s.mi===0&&s.qi===26&&s.screen==='test');check('gate appears',!!d.getElementById('azmExamGate'));check('review modal absent',!d.getElementById('reviewModal'))}
async function brk(){write({...base,screen:'break',mi:2,breakEndAt:Date.now()+500,completed:{rw1:true,rw2:true,math1:false,math2:false}});const d=await load('#azmBreakPage');await waitSel('#azmResumeBtn');check('break surface',!!d.getElementById('azmBreakPage'));check('break rules',/Follow these rules during the break/i.test(d.getElementById('azmBreakPage').textContent));d.getElementById('azmResumeBtn').click();await waitSel('#azmDirectionsPage');const s=st();check('resume enters math directions',s.screen==='directions'&&s.mi===2&&!s.breakEndAt)}
async function finish(){write({...base,screen:'finish',mi:3,completed:{rw1:true,rw2:true,math1:true,math2:true},submitted:true});const d=await load('#azmSubmissionScreen');check('submission surface',!!d.getElementById('azmSubmissionScreen'));check('congratulations',d.querySelector('.azm-congrats-card h1')?.textContent==='Congratulations!');check('completion copy',/test is complete, and your answers have been submitted/i.test(d.querySelector('.azm-congrats-sub')?.textContent||''));check('proctor instruction',/proctor/i.test(d.querySelector('.azm-congrats-copy')?.textContent||''))}
(async()=>{try{await start();cleanup();await recovery();cleanup();await gate();cleanup();await brk();cleanup();await finish();out.textContent=checks.join('\n')+'\nACTUAL EXAM SMOKE COMPLETE'}catch(e){out.textContent=checks.join('\n')+'\nFAIL '+e.message}finally{cleanup()}})()})();
</script>
