<!doctype html><meta charset="utf-8"><title>Actual exam smoke</title><pre id="result">boot</pre><iframe id="app" title="Azaman simulator" style="width:100%;height:800px;border:0"></iframe><script>
(()=>{const K='azaman-sat-practice-v3',out=document.getElementById('result'),frame=document.getElementById('app'),checks=[];let phase=0,done=false;const check=(n,x)=>{checks.push((x?'PASS ':'FAIL ')+n);if(!x)throw Error(n)};const now=()=>Date.now();const base=()=>({v:3,screen:'test',student:'Actual Smoke Student',email:'actual@example.com',password:'',accessCode:'SAT26',roomCode:'AZM24',startCode:'492776',step:10,setupStep:1,setupDone:true,infoCorrect:'yes',deviceOk:'yes',infoOk:true,rulesOk:true,checkinRules:true,aids:{},pledge:'',roomOk:true,mi:0,qi:0,endAt:now()+600000,breakEndAt:null,answers:{},marked:{},eliminated:{},notes:{},highlights:{},completed:{},submitted:false,adaptive:{rw:'easy',math:'easy'},timerHidden:false,lineReader:false,rules:true,desk:true,warning:{},harness:false});const read=()=>JSON.parse(frame.contentWindow.localStorage.getItem(K)||'null');const write=s=>frame.contentWindow.localStorage.setItem(K,JSON.stringify(s));const reload=s=>{write(s);setTimeout(()=>frame.contentWindow.location.reload(),160)};const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');const finalize=text=>{if(done)return;done=true;try{frame.remove();}catch(_){}document.open();document.write('<!doctype html><meta charset="utf-8"><title>Actual exam smoke result</title><pre id="result">'+esc(text)+'</pre>');document.close()};const fail=e=>finalize(checks.join('\n')+'\nFAIL '+(e?.message||e));
frame.addEventListener('error',e=>fail(e));
frame.addEventListener('load',()=>{if(done)return;setTimeout(()=>{try{const d=frame.contentDocument;if(!d?.body)throw Error('frame body missing');
if(phase===0){phase=1;reload({...base(),screen:'checkin',step:8,endAt:null});return}
if(phase===1){check('start code surface renders',!!d.getElementById('azmStartCodePage'));check('numbers-only instruction',/numbers only/i.test(d.body.textContent));check('six input boxes',d.querySelectorAll('.azm-start-digit').length===6);check('start test control',!!d.getElementById('azmStartTest'));d.querySelectorAll('.azm-start-digit').forEach((x,i)=>{x.value=base().startCode[i];x.dispatchEvent(new Event('input',{bubbles:true}))});d.getElementById('azmStartTest').click();setTimeout(()=>{try{check('start enters directions',read().screen==='directions'&&read().mi===0);phase=2;reload({...base(),screen:'signin',mi:2,qi:7,endAt:now()+241000,recovery:{remainingMs:241000,expiresAt:now()+600000},answers:{'rw1-0':'A'}})}catch(e){fail(e)}},100);return}
if(phase===2){check('recovery notice',!!d.getElementById('azmRecoveryNotice'));d.getElementById('email').value=base().email;d.getElementById('email').dispatchEvent(new Event('input',{bubbles:true}));d.getElementById('password').value='resume';d.getElementById('password').dispatchEvent(new Event('input',{bubbles:true}));d.getElementById('signinBtn').click();setTimeout(()=>{try{const s=read();check('recovery resumes test',s.screen==='test'&&s.mi===2&&s.qi===7);check('recovery clears',!s.recovery);check('deadline restored',s.endAt>now()+230000);check('answers survive',s.answers['rw1-0']==='A');phase=3;reload({...base(),screen:'test',mi:0,qi:26,endAt:now()+240000})}catch(e){fail(e)}},100);return}
if(phase===3){check('preview banner hidden',getComputedStyle(d.querySelector('.preview-banner')).display==='none');d.getElementById('nextBtn').click();setTimeout(()=>{try{const s=read();check('early advance blocked',s.mi===0&&s.qi===26&&s.screen==='test');check('gate appears',!!d.getElementById('azmExamGate'));check('review modal absent',!d.getElementById('reviewModal'));phase=4;reload({...base(),screen:'break',mi:2,breakEndAt:now()+3000,completed:{rw1:true,rw2:true,math1:false,math2:false}})}catch(e){fail(e)}},100);return}
if(phase===4){check('break surface',!!d.getElementById('azmBreakPage'));check('break rules',/Follow these rules during the break/i.test(d.getElementById('azmBreakPage').textContent));d.getElementById('azmResumeBtn').click();setTimeout(()=>{try{const s=read();check('resume enters math directions',s.screen==='directions'&&s.mi===2&&!s.breakEndAt);phase=5;reload({...base(),screen:'finish',mi:3,completed:{rw1:true,rw2:true,math1:true,math2:true},submitted:true})}catch(e){fail(e)}},100);return}
if(phase===5){check('submission surface',!!d.getElementById('azmSubmissionScreen'));check('congratulations',d.querySelector('.azm-congrats-card h1')?.textContent==='Congratulations!');check('completion copy',/test is complete, and your answers have been submitted/i.test(d.querySelector('.azm-congrats-sub')?.textContent||''));check('proctor instruction',/proctor/i.test(d.querySelector('.azm-congrats-copy')?.textContent||''));finalize(checks.join('\n')+'\nACTUAL EXAM SMOKE COMPLETE')}
}catch(e){fail(e)}},160)});
frame.src='../index.html?browser-smoke=1';
})()
</script>
