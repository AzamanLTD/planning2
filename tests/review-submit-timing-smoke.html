<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Azaman review timing smoke</title></head>
<body>
  <pre id="result">running</pre>
  <iframe id="app" title="Azaman simulator" style="width:100%;height:700px;border:0"></iframe>
  <script>
    (() => {
      const out = document.getElementById('result');
      const frame = document.getElementById('app');
      const KEY = 'azaman-sat-practice-v3';
      localStorage.setItem(KEY, JSON.stringify({
        v: 3, screen: 'test', student: 'Timing Smoke', accessCode: 'SAT26', roomCode: 'AZM24', startCode: '492776',
        mi: 0, qi: 26, endAt: Date.now() + 60000, breakEndAt: null,
        answers: {}, marked: {}, eliminated: {}, notes: {}, highlights: {}, completed: {}, submitted: false,
        adaptive: { rw: 'easy', math: 'easy' }, timerHidden: false, lineReader: false, rules: true, desk: true, warning: {}
      }));
      frame.src = '../index.html?review-submit-timing-smoke=' + Date.now();

      const waiter = setInterval(() => {
        try {
          const doc = frame.contentDocument;
          if (doc?.readyState !== 'complete' || !doc.getElementById('nextBtn')) return;
          clearInterval(waiter);
          doc.getElementById('nextBtn').click();
          setTimeout(() => {
            try {
              const modal = doc.getElementById('reviewModal');
              const button = doc.getElementById('submitModule');
              if (!modal || !button) throw new Error('review modal did not open');
              if (!button.disabled || button.getAttribute('aria-disabled') !== 'true') throw new Error('early module submission is not blocked');
              if (!doc.getElementById('reviewTimingNote')?.textContent.includes('time expires')) throw new Error('timing guidance is missing');
              const state = JSON.parse(localStorage.getItem(KEY));
              state.endAt = Date.now() - 1;
              localStorage.setItem(KEY, JSON.stringify(state));
              setTimeout(() => {
                try {
                  if (button.disabled) throw new Error('submit did not unlock after persisted deadline expired');
                  button.click();
                  setTimeout(() => {
                    try {
                      const next = JSON.parse(localStorage.getItem(KEY));
                      if (!next.completed?.rw1) throw new Error('module did not submit after deadline');
                      if (next.screen !== 'directions' || next.mi !== 1) throw new Error(`unexpected post-submit state: ${next.screen}/${next.mi}`);
                      out.textContent = 'PASS early submission blocked, timing guidance shown, submit unlocked after deadline, module transition preserved\nREVIEW SUBMIT TIMING SMOKE COMPLETE';
                    } catch (error) { out.textContent = `FAIL ${error.message}`; }
                    finally { frame.remove(); }
                  }, 80);
                } catch (error) { out.textContent = `FAIL ${error.message}`; frame.remove(); }
              }, 180);
            } catch (error) { out.textContent = `FAIL ${error.message}`; frame.remove(); }
          }, 120);
        } catch (_) {}
      }, 50);
    })();
  </script>
</body>
</html>
